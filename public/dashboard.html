<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — GUARDIAN</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body class="dashboard-page">
  <div class="topbar">
    <div>
      <h1 class="brand">GUARDI<span>AN</span></h1>
      <p class="tagline">Suivi de votre enfant</p>
    </div>
    <button class="link" id="logoutBtn">Déconnexion</button>
  </div>

  <div class="page">
    <h2 class="section-title" style="margin-top:0;">Mes enfants</h2>
    <div id="childrenList"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      Aucun tracker ajouté pour l'instant. Ajoutez-en un ci-dessous pour commencer le suivi.
    </div>

    <div class="card add-child-form">
      <h2 style="margin-top:0; font-size:1rem;">Ajouter un tracker</h2>
      <form id="addChildForm">
        <label for="childName">Nom de l'enfant</label>
        <input type="text" id="childName" required>

        <label for="deviceId">Identifiant du tracker</label>
        <input type="text" id="deviceId" required placeholder="ex: TRACKER01">

        <div class="error-msg" id="addErrorMsg"></div>

        <button type="submit" class="primary gold">Ajouter</button>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
